<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cổng đăng nhập Delta Force</title>
    <link rel="icon" type="image/png" href="assets/dfvn-cloud-cat.png?v=20261005" />
    <link rel="stylesheet" href="styles.css?v=20261007-map-access-1" />
      <link rel="stylesheet" href="brand-theme.css?v=20261007-auth-ui-1" />
  <link rel="stylesheet" href="music-player.css?v=20261010-v1">
</head>
  <body class="auth-page">
    <div class="auth-backdrop"></div>

    <main class="auth-shell">
      <div class="auth-panel auth-form-wrap">
        <div class="panel-topbar">
          <a class="back-home-link" href="index.html">Quay về trang chủ</a>
        </div>

        <div class="brand-center" aria-label="Logo Delta Force">
          <div class="logo-slot" aria-hidden="true"></div>
        </div>

        <div class="form-header">
          <h2>Đăng nhập</h2>
        </div>
        <p class="map-login-notice" id="mapLoginNotice" role="alert" hidden>Bạn cần đăng nhập để sử dụng bản đồ chiến thuật</p>

        <form id="loginForm" class="auth-form" data-mode="login">
          <label class="signup-only hidden">
            <span>Tên tài khoản</span>
            <input type="text" id="accountName" placeholder="Ít nhất 7 ký tự, gồm chữ và số" autocomplete="off" maxlength="24" />
          </label>

          <label>
            <span id="authIdentifierLabel">Gmail hoặc tên tài khoản</span>
            <input type="text" id="username" placeholder="Gmail hoặc tên tài khoản" autocomplete="username" required />
          </label>

          <label class="phone-field signup-only hidden">
            <span>Số điện thoại</span>
            <input type="tel" id="phone" placeholder="09xxxxxxxx" autocomplete="tel" />
          </label>

          <label class="password-field">
            <span id="authPasswordLabel">Mật khẩu</span>
            <div class="input-shell">
              <input type="password" id="password" placeholder="Nhập mật khẩu" required />
              <button type="button" class="field-toggle" data-toggle-target="password" aria-label="Hiện mật khẩu">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="field-toggle-icon">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3.2"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="signup-only hidden">
            <span>Nhập lại mật khẩu</span>
            <div class="input-shell">
              <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" />
              <button type="button" class="field-toggle" data-toggle-target="confirmPassword" aria-label="Hiện mật khẩu xác nhận">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="field-toggle-icon">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3.2"/>
                </svg>
              </button>
            </div>
            <div class="field-message" id="confirmPasswordMessage" aria-live="polite"></div>
          </label>

          <label class="signup-only hidden">
            <span>Mật khẩu cấp 2</span>
            <div class="input-shell">
              <input type="password" id="secondaryPassword" placeholder="Khác mật khẩu chính, có số và ký tự đặc biệt" autocomplete="new-password" />
              <button type="button" class="field-toggle" data-toggle-target="secondaryPassword" aria-label="Hiện mật khẩu cấp 2">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="field-toggle-icon">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3.2"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="code-field hidden">
            <span>Mã xác minh gửi đến Gmail</span>
            <input type="text" id="authCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="6 chữ số" />
          </label>

          <div class="auth-extra-row login-only">
            <a href="#" class="text-muted-link forgot-password-link">Quên mật khẩu?</a>
          </div>

          <div class="form-message" aria-live="polite"></div>
          <div class="auth-flow-actions">
            <button type="button" class="auth-resend hidden" id="authResend">Gửi lại mã</button>
            <button type="button" class="auth-cancel hidden" id="authCancel">Quay lại đăng nhập</button>
          </div>

          <button type="submit" class="auth-submit full-width">
            <span class="submit-arrow" aria-hidden="true"><svg class="ui-arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
            <span>Đăng nhập</span>
          </button>
        </form>

        <div class="divider"><span>HOẶC</span></div>

        <div class="social-login-group" aria-label="Đăng nhập bằng tài khoản xã hội">
          <a href="/api/auth/discord" class="social-btn discord-btn" data-oauth-provider="discord" aria-label="Đăng nhập bằng Discord">
            <span class="social-mark" aria-hidden="true">
              <img src="assets/discord-symbol-official.svg?v=20261006" alt="" width="64" height="48">
            </span>
            <span>Discord</span>
          </a>
          <a href="/api/auth/google" class="social-btn google-btn" data-oauth-provider="google" aria-label="Đăng nhập bằng Google">
            <span class="social-mark" aria-hidden="true">
              <img src="assets/google-g-official.png?v=20261006" alt="" width="200" height="205">
            </span>
            <span>Google</span>
          </a>
        </div>

        <div class="local-demo-login" style="margin-top:16px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:0.75rem;color:#8fa0b5;text-align:center;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;">— Đăng nhập nhanh thử nghiệm —</div>
          <button type="button" class="social-btn" onclick="quickLoginLocal('admin', 'admin')" style="background:rgba(255,50,70,0.12);border:1px solid #ff3344;color:#ff5566;justify-content:center;cursor:pointer;">
            <span>⚡ Đăng nhập Quản Trị Viên (Admin)</span>
          </button>
          <button type="button" class="social-btn" onclick="quickLoginLocal('creator', 'zicneee')" style="background:rgba(102,228,173,0.12);border:1px solid #66e4ad;color:#66e4ad;justify-content:center;cursor:pointer;">
            <span>⚡ Đăng nhập Content Creator (Zic nèee)</span>
          </button>
          <button type="button" class="social-btn" onclick="quickLoginLocal('member', 'delta_player')" style="background:rgba(0,200,255,0.12);border:1px solid #00f0ff;color:#00f0ff;justify-content:center;cursor:pointer;">
            <span>⚡ Đăng nhập Game Thủ (Member)</span>
          </button>
        </div>

        <p class="switch-link">
          <span class="switch-copy">Bạn chưa có tài khoản?</span>
          <a href="#" class="create-account-link">Tạo ngay</a>
        </p>
      </div>
    </main>

    <script>
      function quickLoginLocal(role, username) {
        localStorage.setItem('pieNoirUser', username);
        localStorage.setItem('pieNoirRole', role);
        if (role === 'admin') {
          localStorage.setItem('pnServerAdminAccountId', 'admin');
        } else {
          localStorage.removeItem('pnServerAdminAccountId');
        }
        const profileKey = `pienoirProfile:${username}`;
        let profile = {};
        try { profile = JSON.parse(localStorage.getItem(profileKey) || '{}'); } catch {}
        profile.displayName = username === 'admin' ? 'Quản Trị Viên' : username === 'zicneee' ? 'Zic nèee' : 'Chuột Đột Kích';
        localStorage.setItem(profileKey, JSON.stringify(profile));
        
        fetch('/api/auth/quick-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role, username })
        }).finally(() => {
          const redirect = new URLSearchParams(location.search).get('redirect') || (role === 'admin' ? 'admin.html' : 'index.html');
          location.href = redirect;
        });
      }
    </script>

        <footer class="site-footer company-footer" id="site-footer">
    <div class="container company-footer-wrap">
      <div class="company-footer-bottom"><span>© 2026 · Phát triển bởi Minh Khương.</span></div>
    </div>
  </footer>
<script src="script.js?v=20261008-mail-code-fix-1"></script>
  
  <script src="music-player.js?v=20261010-v1" defer></script>
</body>
</html>
