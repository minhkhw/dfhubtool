  </defs>
  <image href="dfvn-cloud-cat.png" x="78" y="0" width="868" height="690" preserveAspectRatio="xMidYMid meet"/>
  <text x="512" y="814" fill="url(#wordmark)" stroke="#363064" stroke-width="10" paint-order="stroke" text-anchor="middle" font-family="Nunito, 'Arial Rounded MT Bold', Arial, sans-serif" font-size="142" font-weight="900" letter-spacing="1">dfvn</text>
</svg>
